# Nginx Configuration for GovChat
# Place this file in /etc/nginx/sites-available/govchat
# Enable with: sudo ln -s /etc/nginx/sites-available/govchat /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS (uncomment after SSL setup)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name seu-dominio.gov.br www.seu-dominio.gov.br;
#     return 301 https://$server_name$request_uri;
# }

server {
    # HTTP Configuration (comment out after SSL setup)
    listen 80;
    listen [::]:80;
    
    # HTTPS Configuration (uncomment after SSL setup)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    
    server_name seu-dominio.gov.br www.seu-dominio.gov.br;
    
    # SSL Configuration (uncomment after certbot)
    # ssl_certificate /etc/letsencrypt/live/seu-dominio.gov.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seu-dominio.gov.br/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # Document root
    root /var/www/govchat/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/govchat_access.log;
    error_log /var/log/nginx/govchat_error.log warn;

    # Max upload size
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Uncomment after SSL

    # Cache static assets (CSS, JS, Images, Fonts)
    location ~* ^/assets/.+\.(css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Cache media files
    location ~* \.(jpg|jpeg|gif|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # No cache for HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA fallback - CRITICAL for React Router
    location / {
        try_files $uri $uri/ /index.html;
        
        # Additional headers for HTML
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Block access to hidden files (.env, .git, etc)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block access to sensitive files
    location ~* (\.env|\.git|\.htaccess|\.htpasswd|package\.json|package-lock\.json)$ {
        deny all;
        return 404;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
